version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: banna-immo-postgres
    restart: always
    environment:
      POSTGRES_USER: banna_user
      POSTGRES_PASSWORD: banna_password
      POSTGRES_DB: banna_immo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: banna-immo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: banna-immo-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
